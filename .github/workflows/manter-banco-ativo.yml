# Mantém o banco do Supabase (plano grátis) acordado.
# O plano grátis pausa o projeto depois de 7 dias sem uso; esta rotina faz uma consulta leve a cada 2 dias.
name: Manter banco ativo
on:
  schedule:
    - cron: '17 9 */2 * *'   # a cada 2 dias, 09:17 UTC
  workflow_dispatch: {}        # também dá para rodar na mão (aba Actions)
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar o banco
        run: |
          KEY=$(grep '^VITE_SUPABASE_ANON_KEY=' .env.production | cut -d= -f2-)
          URL=$(grep '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' --retry 3 --retry-delay 20 "$URL/rest/v1/cidades?select=nome&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"; cat /tmp/r.json
          [ "$code" = "200" ]
